<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scorer</title>
<script>
  // Theme before first paint: ?theme= > saved choice > OS preference (CSS handles the last).
  (function () {
    var t = new URLSearchParams(location.search).get('theme');
    try { t = t || localStorage.getItem('scorer-theme'); } catch (e) {}
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.9 5.8L20 10.7l-6.1 1.9L12 18.5l-1.9-5.9L4 10.7l6.1-1.9z"/><path d="M19 3v4M17 5h4"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></symbol>
</svg>

<div class="shell">
  <header class="topbar">
    <span class="wordmark">scorer</span>
    <span class="sep" aria-hidden="true"></span>
    <span class="crumb" id="crumb">Today</span>
    <span class="spacer"></span>
    <div class="daypick">
      <button class="btn ghost icon-only" id="prev" type="button" aria-label="Previous day"><svg class="icon"><use href="#i-left"/></svg></button>
      <select id="day" aria-label="Day"></select>
      <button class="btn ghost icon-only" id="next" type="button" aria-label="Next day"><svg class="icon"><use href="#i-right"/></svg></button>
    </div>
    <button class="btn outline icon-only" id="theme" type="button" aria-label="Toggle theme"><svg class="icon"><use href="#i-moon"/></svg></button>
    <button class="btn outline toggle" id="askbtn" type="button" aria-pressed="false" aria-controls="ask"><svg class="icon"><use href="#i-spark"/></svg>Ask AI</button>
  </header>

  <div class="frame">
    <div class="main-col" id="maincol">
      <nav class="tabs" aria-label="Views">
        <a href="#/today" data-tab="today">Today</a>
        <a href="#/sessions" data-tab="sessions">Sessions</a>
        <a href="#/trends" data-tab="trends">Trends</a>
        <a href="#/leverage" data-tab="leverage">Leverage</a>
      </nav>
      <main class="content" id="view" aria-live="polite"></main>
    </div>

    <aside class="ask" id="ask" aria-label="Ask scorer" aria-hidden="true">
      <div class="ask-inner">
        <div class="conv" id="conv"><div class="conv-content" id="log"></div></div>
        <div class="composer">
          <textarea id="input" rows="1" placeholder="Ask about this day…" aria-label="Message"></textarea>
          <button class="send" id="send" type="button" aria-label="Send message" disabled><svg class="icon"><use href="#i-up"/></svg></button>
        </div>
        <div class="peek" id="peek" aria-hidden="true">
          <div class="peek-head">
            <div><div class="t" id="peek-title"></div><div class="s" id="peek-sub"></div></div>
            <button class="x" id="peek-close" type="button" aria-label="Close"><svg class="icon"><use href="#i-x"/></svg></button>
          </div>
          <div class="peek-body" id="peek-body"></div>
        </div>
      </div>
    </aside>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
