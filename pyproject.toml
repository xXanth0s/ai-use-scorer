[project]
name = "scorer"
version = "0.1.0"
description = "Scores how a human uses coding agents (Claude Code, Codex) from local transcripts and hooks"
requires-python = ">=3.11"
dependencies = ["click>=8.1"]

[project.optional-dependencies]
judge = ["anthropic>=0.40"]

[project.scripts]
scorer = "scorer.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
